# Tanımlama kuralları (ServiceNow cmdb_identifier / cmdb_identifier_entry semantiği).
# Öncelik numarası küçük olan önce denenir. Kural alt sınıflara kalıtılır.
#
# evren_extension: true → ServiceNow temel kural setinde olmayan, Evren'in eklediği girdi.
# Tüm kural eşleşmeleri ayrıca çelişki kontrolünden geçer (seri/UUID/OS/sınıf/FQDN);
# çelişki varsa otomatik birleştirme yapılmaz, kayıt eşleştirme kuyruğuna düşer.
version: 1
rules:
  - applies_to: cmdb_ci_hardware
    independent: true
    description: Donanım (sunucu, ağ cihazı) — SN temel kuralı + UUID/FQDN uzantısı
    entries:
      - {priority: 100, search_table: cmdb_serial_number, attributes: [serial_number, serial_number_type]}
      - {priority: 150, attributes: [bios_uuid], evren_extension: true}
      - {priority: 200, attributes: [serial_number]}
      - {priority: 280, attributes: [fqdn], evren_extension: true}
      - {priority: 300, attributes: [name]}
      - {priority: 400, search_table: cmdb_ci_network_adapter, attributes: [mac_address, name]}

  - applies_to: cmdb_ci_vm_instance
    independent: true
    description: Sanal makine örneği (vCenter nesnesi)
    verify: true
    entries:
      - {priority: 100, attributes: [correlation_id]}
      - {priority: 200, attributes: [vcenter_uuid, object_id]}

  - applies_to: cmdb_ci_appl
    independent: false
    description: Uygulama — üst CI (Runs on::Runs → donanım) bağlamında ad ile tanımlanır
    parent_relation: {type: "Runs on::Runs", parent_class: cmdb_ci_hardware}
    entries:
      - {priority: 100, attributes: [name]}

  - applies_to: cmdb_ci_network_adapter
    independent: false
    description: Ağ adaptörü — bağlı olduğu CI (cmdb_ci alanı) bağlamında MAC ile tanımlanır
    parent_reference: cmdb_ci
    entries:
      - {priority: 100, attributes: [mac_address]}

  # --- U4.2 (ADR-0019): yeni sınıflar ------------------------------------------------------------------
  # Sınıf anahtarı (attr:<alan>) kurum genelinde tekil özniteliktir: farklı değer çelişki sayılır.
  - applies_to: cmdb_ci_cloud_service_account
    independent: true
    description: Bulut hizmet hesabı / aboneliği — sağlayıcının hesap kimliği
    verify: true
    entries:
      - {priority: 100, attributes: [account_id]}
      - {priority: 200, attributes: [correlation_id], evren_extension: true}

  - applies_to: cmdb_ci_cluster
    independent: true
    description: Küme (Windows, vCenter dışı, Kubernetes) — küme kimliği; ad tek başına yetmez
    verify: true
    entries:
      - {priority: 100, attributes: [cluster_id]}
      - {priority: 200, attributes: [correlation_id], evren_extension: true}

  - applies_to: cmdb_ci_ip_network
    independent: true
    description: IP ağı — CIDR biçiminde alt ağ (VRF çakışması olan kurumda bağımlı kurala çevrilmeli)
    verify: true
    entries:
      - {priority: 100, attributes: [subnet], evren_extension: true}

  - applies_to: cmdb_ci_oslv_container
    independent: true
    description: Konteyner — çalışma zamanının verdiği konteyner kimliği
    verify: true
    entries:
      - {priority: 100, attributes: [correlation_id]}

  # CSDM ve yönetişim kayıtları keşfedilmez; elle veya ServiceNow'dan gelir. Ad sınıf ailesi içinde aranır,
  # çelişki denetimi yine çalışır (kural 7).
  - applies_to: cmdb_ci_service
    independent: true
    description: Servis, servis sunumu, uygulama servisi — korelasyon kimliği, sonra ad
    verify: true
    entries:
      - {priority: 100, attributes: [correlation_id], evren_extension: true}
      - {priority: 200, attributes: [name], evren_extension: true}

  - applies_to: cmdb_ci_business_app
    independent: true
    description: İş uygulaması — korelasyon kimliği, sonra ad
    verify: true
    entries:
      - {priority: 100, attributes: [correlation_id], evren_extension: true}
      - {priority: 200, attributes: [name], evren_extension: true}

  - applies_to: cmdb_ci_business_capability
    independent: true
    description: İş yeteneği — ad
    verify: true
    entries:
      - {priority: 100, attributes: [name], evren_extension: true}

  - applies_to: cmdb_ci_business_process
    independent: true
    description: İş süreci — ad
    verify: true
    entries:
      - {priority: 100, attributes: [name], evren_extension: true}

  - applies_to: cmdb_ci_information_object
    independent: true
    description: Bilgi nesnesi — ad
    verify: true
    entries:
      - {priority: 100, attributes: [name], evren_extension: true}

  # Bağımlı CI'lar: yalnızca üst CI bağlamında tekildir. Üst bağlam çözümlemesi U7'de (F1-07);
  # o zamana kadar çözümleyici güvenli varsayılanla "kimlik yetersiz" döner, küresel ad eşleştirmesi yapmaz.
  - applies_to: cmdb_ci_kubernetes_component
    independent: false
    description: Kubernetes bileşeni — küme bağlamında ad alanı + ad
    verify: true
    parent_relation: {type: "Contains::Contained by", parent_class: cmdb_ci_kubernetes_cluster}
    entries:
      - {priority: 100, attributes: [namespace, name]}

  - applies_to: cmdb_ci_file_system
    independent: false
    description: Dosya sistemi — bağlı bilgisayar bağlamında bağlama noktası
    verify: true
    parent_reference: computer
    entries:
      - {priority: 100, attributes: [mount_point]}

  - applies_to: cmdb_ci_cluster_node
    independent: false
    description: Küme düğümü — küme bağlamında ad
    verify: true
    parent_reference: cluster
    entries:
      - {priority: 100, attributes: [name]}

  - applies_to: cmdb_ci_logical_datacenter
    independent: false
    description: Bulut bölgesi — hizmet hesabı bağlamında bölge
    verify: true
    parent_relation: {type: "Hosted on::Hosts", parent_class: cmdb_ci_cloud_service_account}
    entries:
      - {priority: 100, attributes: [region]}

  - applies_to: cmdb_ci_database
    independent: false
    description: Veritabanı kataloğu — veritabanı örneği bağlamında ad
    verify: true
    parent_relation: {type: "Contains::Contained by", parent_class: cmdb_ci_db_instance}
    entries:
      - {priority: 100, attributes: [name]}
