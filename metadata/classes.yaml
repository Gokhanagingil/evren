# ServiceNow CMDB sınıf hiyerarşisinin çekirdek alt kümesi (Evren tohum verisi).
#
# ÖNEMLİ: Bu dosya bir başlangıç noktasıdır. Kesin kaynak sizin ServiceNow
# örneğinizdir. `tools/sn_metadata_export.py` ile sys_db_object / sys_dictionary /
# sys_choice dışa aktarılır, `metadata/imported/` altına yazılır ve bu dosyayla
# karşılaştırılır. `verify: true` işaretli sınıf/alanlar örnekten mutlaka
# doğrulanmalıdır (sürüme ve eklentilere göre farklılık gösterebilir).
#
# Alan depolama:
#   storage: column  → cmdb.cmdb_ci tablosunda fiziksel kolon (yalnızca cmdb_ci alanları)
#   (varsayılan)     → cmdb.cmdb_ci.class_attributes JSONB içinde; metadata sözlüğü tip
#                      ve doğrulamayı uygular, sık sorgulanan alanlar için ifade indeksi açılır.
#
# Tipler: string, integer, decimal, boolean, glide_date_time, glide_date, reference
# choice: true → değerler sys_choice'tan (choices.yaml) gelir.
version: 1
classes:
  - name: cmdb_ci
    label: Configuration Item
    label_tr: Konfigürasyon Öğesi
    extends: null
    fields:
      - {name: name, type: string, max_length: 255, label_tr: Ad, storage: column}
      - {name: short_description, type: string, max_length: 1000, label_tr: Kısa açıklama, storage: column}
      - {name: serial_number, type: string, max_length: 255, label_tr: Seri numarası, storage: column}
      - {name: asset_tag, type: string, max_length: 255, label_tr: Varlık etiketi, storage: column}
      - {name: ip_address, type: string, max_length: 255, label_tr: IP adresi, storage: column}
      - {name: mac_address, type: string, max_length: 255, label_tr: MAC adresi, storage: column}
      - {name: fqdn, type: string, max_length: 255, label_tr: FQDN, storage: column}
      - {name: dns_domain, type: string, max_length: 255, label_tr: DNS alanı, storage: column}
      - {name: operational_status, type: integer, choice: true, label_tr: Operasyonel durum, storage: column}
      - {name: install_status, type: integer, choice: true, label_tr: Kurulum durumu, storage: column}
      - {name: used_for, type: string, max_length: 40, choice: true, label_tr: Kullanım amacı, storage: column}
      - {name: discovery_source, type: string, max_length: 40, choice: true, label_tr: Keşif kaynağı, storage: column}
      - {name: first_discovered, type: glide_date_time, label_tr: İlk keşif, storage: column}
      - {name: last_discovered, type: glide_date_time, label_tr: Son keşif, storage: column}
      - {name: manufacturer, type: reference, reference: core_company, label_tr: Üretici, storage: column}
      - {name: model_id, type: reference, reference: cmdb_model, label_tr: Model, storage: column}
      - {name: location, type: reference, reference: cmn_location, label_tr: Konum, storage: column}
      - {name: company, type: reference, reference: core_company, label_tr: Şirket, storage: column}
      - {name: department, type: reference, reference: cmn_department, label_tr: Departman, storage: column}
      - {name: support_group, type: reference, reference: sys_user_group, label_tr: Destek grubu, storage: column}
      - {name: assignment_group, type: reference, reference: sys_user_group, label_tr: Atama grubu, storage: column}
      - {name: change_control, type: reference, reference: sys_user_group, label_tr: Onay grubu, storage: column}
      - {name: managed_by, type: reference, reference: sys_user, label_tr: Yöneten, storage: column}
      - {name: owned_by, type: reference, reference: sys_user, label_tr: Sahibi, storage: column}
      - {name: assigned_to, type: reference, reference: sys_user, label_tr: Atanan kişi, storage: column}
      - {name: duplicate_of, type: reference, reference: cmdb_ci, label_tr: Mükerrer kaydı, storage: column}
      - {name: correlation_id, type: string, max_length: 512, label_tr: Korelasyon kimliği, storage: column}
      - {name: object_id, type: string, max_length: 512, label_tr: Nesne kimliği, storage: column}
      - {name: category, type: string, max_length: 100, label_tr: Kategori, storage: column}
      - {name: subcategory, type: string, max_length: 100, label_tr: Alt kategori, storage: column}
      - {name: install_date, type: glide_date_time, label_tr: Kurulum tarihi, storage: column}
      - {name: warranty_expiration, type: glide_date, label_tr: Garanti bitişi, storage: column}
      # CSDM 5 yaşam döngüsü alanları. ServiceNow'da life_cycle_stage /
      # life_cycle_stage_status tablolarına referanstır; Evren'de değer listesidir (choices.yaml):
      # aşama durumu aşamaya bağımlıdır (dependent_value) ve eski operational_status /
      # install_status değerlerine eşlenir (ADR-0019).
      - {name: life_cycle_stage, type: string, max_length: 100, choice: true, label_tr: Yaşam döngüsü aşaması, storage: column, verify: true}
      - {name: life_cycle_stage_status, type: string, max_length: 100, choice: true, label_tr: Aşama durumu, storage: column, verify: true}
      - {name: comments, type: string, max_length: 4000, label_tr: Yorumlar, storage: column}

