      - {name: cpu_count, type: integer, label_tr: CPU sayısı, indexed: true}
      - {name: cpu_core_count, type: integer, label_tr: Çekirdek sayısı}
      - {name: cpu_speed, type: integer, label_tr: CPU hızı (MHz)}
      - {name: cpu_type, type: string, max_length: 255, label_tr: CPU tipi}
      - {name: ram, type: integer, label_tr: RAM (MB), indexed: true}
      - {name: disk_space, type: decimal, label_tr: Disk alanı (GB)}
      - {name: virtual, type: boolean, label_tr: Sanal, indexed: true}
