# vCenter VirtualMachine → cmdb_ci_vmware_instance
# Bağlayıcı her VM için iki kayıt üretir: VM örneği (bu dosya) ve misafir sunucu
# (guest_server.mapping.yaml). ServiceNow modelinde bunlar ayrı CI'lardır:
#   <sunucu> --Instantiates::Instantiated by--> <VM örneği> --Registered on::Has registered--> <ESXi host>
#   <sunucu> --Virtualized by::Virtualizes--> <ESXi host>   (guest_server.mapping.yaml)
# Bağlayıcı ham JSON'a vCenter örnek UUID'sini `_vcenter.instanceUuid`, nitelikli host anahtarını `_ref.host`
# ("<vCenter örnek kimliği>/host-221"; esx_host.mapping.yaml'ın kaynak anahtarı) olarak ekler (ADR-0020).
# Alan adları vSphere VI/JSON 8.0.1.0 tanımıyla karşılaştırıldı (VirtualMachineConfigInfo, VirtualHardware,
# VirtualMachineRuntimeInfo, GuestInfo, GuestNicInfo); gerçek çıktıyla kabul U10'da.
# Şablonlar (config.template = true) CI değildir: require ile dışarıda kalır.
description: VMware sanal makine örnekleri
verify: true
data_source: vCenter
source_key: config.instanceUuid
class: cmdb_ci_vmware_instance
require:                                   # hepsi sağlanmalı
  - {from: _type, matches: "^VirtualMachine$"}
  - {from: config.template, matches: "^false$"}
attributes:
  name: {from: name, transform: strip}
  correlation_id: {from: config.instanceUuid, transform: lower}
  vm_instance_uuid: {from: config.instanceUuid, transform: lower}
  object_id: {from: _moId}
  vcenter_uuid: {from: _vcenter.instanceUuid, transform: lower}
  bios_uuid: {from: config.uuid, transform: lower}
  cpus: {from: config.hardware.numCPU, transform: int}
  memory: {from: config.hardware.memoryMB, transform: int}
  template: {from: config.template, transform: bool}
  guest_id: {from: config.guestId}
  image_path: {from: config.files.vmPathName}
  state: {from: runtime.powerState, map: {poweredOn: "on", poweredOff: "off", suspended: "paused"}}
lookup:
  mac_addresses: {from: "guest.net[*].macAddress"}
relations:
  - {type: "Registered on::Has registered", direction: parent, target: _ref.host, target_class: cmdb_ci_esx_server}
