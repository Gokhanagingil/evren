# BMC — AÇIK SORU: Kurumda hangi BMC ürünü kullanılıyor?
#   (a) BMC Discovery / ADDM  (b) BMC Client Management  (c) BMC Helix Discovery
# Bu dosya BMC Discovery "Host" düğümü varsayımıyla yazılmış bir taslaktır; ürün
# netleşince alan adları doğrulanmalıdır. Diğer bileşenler bu karardan etkilenmez.
description: Ajan tabanlı sunucu envanteri (TASLAK — ürün doğrulanacak)
verify: true
data_source: BMC
source_key: key
class: cmdb_ci_server
class_rules:
  - when: {from: os_type, matches: "(?i)windows"}
    class: cmdb_ci_win_server
  - when: {from: os_type, matches: "(?i)linux"}
    class: cmdb_ci_linux_server
  - when: {from: os_type, matches: "(?i)aix"}
    class: cmdb_ci_aix_server
  - when: {from: os_type, matches: "(?i)solaris"}
    class: cmdb_ci_solaris_server
attributes:
  name: {from: hostname, fallback: name, transform: strip}
  fqdn: {from: fqdn, transform: lower}
  serial_number: {from: serial, transform: strip}
  bios_uuid: {from: uuid, transform: lower}
  os: {from: os}
  os_version: {from: os_version}
  cpu_count: {from: num_processors, transform: int}
  cpu_core_count: {from: cores_per_processor, transform: int}
  ram: {from: ram, transform: int}
lookup:
  ip_addresses: {from: "ip_addrs[*]"}
  mac_addresses: {from: "mac_addrs[*]"}
external_ids:
  bmc_key: {from: key}
