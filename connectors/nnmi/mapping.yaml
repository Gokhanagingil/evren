# OpenText (Micro Focus) NNMi — Node
# NNMi API'si sürüme göre değişir (SOAP NodeBeanService / InterfaceBeanService / REST). Alan adları kurumdaki
# sürümle doğrulanmalıdır (verify). Arayüzler istemcide düğüme katılır (F1-03): _mac_addresses kimlik eşleşmesine,
# _interface_count fiziksel arayüz sayısına, _l2_down/_l2_up aynı L2 bağlantısını paylaşan komşulara gider (kimliği
# küçük uç üst; iki uçtan gelen kayıt aynı ilişkiyi üretir). Ağ adaptörü ayrı CI değildir (bağımlı CI kimliği, U7);
# kapsam dışındaki komşuya (ör. sunucu) giden bağlantı, o uç NNMi kaydı olmadığından yazılmaz.
description: Ağ cihazları (switch, router, firewall, yük dengeleyici, kablosuz)
verify: true
data_source: NNMi
source_key: uuid
class: cmdb_ci_netgear
include_when:
  - {from: deviceCategory, matches: "(?i)switch|router|firewall|loadbalancer|wireless|chassis"}
class_rules:
  - when: {from: deviceCategory, matches: "(?i)firewall"}
    class: cmdb_ci_ip_firewall
  - when: {from: deviceCategory, matches: "(?i)loadbalancer"}
    class: cmdb_ci_lb
  - when: {from: deviceCategory, matches: "(?i)wireless"}
    class: cmdb_ci_wap_network
  # L3 switch'ler (switchrouter) ServiceNow'daki gibi switch sınıfında kalır; can_route ile işaretlenir.
  - when: {from: deviceCategory, matches: "(?i)switch"}
    class: cmdb_ci_ip_switch
  - when: {from: deviceCategory, matches: "(?i)router"}
    class: cmdb_ci_ip_router
attributes:
  name: {from: systemName, fallback: name, transform: strip}
  fqdn: {from: longName, transform: lower}
  ip_address: {from: managementAddress}
  serial_number: {from: serialNumber, transform: strip}
  firmware_version: {from: systemDescription}
  physical_interface_count: {from: _interface_count}
lookup:
  mac_addresses: {from: _mac_addresses}
relations:
  - {type: "Connects to::Connected by", direction: parent, target: {from: _l2_down}, target_class: cmdb_ci_netgear}
  - {type: "Connects to::Connected by", direction: child, target: {from: _l2_up}, target_class: cmdb_ci_netgear}
# sysObjectID (systemObjectId) harici kimlik DEĞİLDİR: cihazı değil modeli tanımlar; aynı modeldeki tüm
# cihazlarda aynıdır ve kimlik kanıtı sayılırsa farklı cihazları birleştirir.
external_ids:
  nnmi_uuid: {from: uuid}
