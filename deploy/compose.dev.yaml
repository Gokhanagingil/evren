# Evren — YEREL GELİŞTİRME yığını (U1, ADR-0016). Üretim dağıtımı değildir (docs/12-operasyon-ve-olcek.md).
#
#   python tools/dev_stack.py up --demo   # sırlar → imaj → göç → demo verisi → Kafka konuları → servisler
#   python tools/dev_stack.py smoke       # uçtan uca duman testi (CI "Yığın" işiyle aynı)
#   python tools/dev_stack.py down        # durdur (--volumes: veriyi de sil)
#   tarayıcı: http://127.0.0.1:8088 · alım geçidi: http://127.0.0.1:8089/ingest/v1
#
# Dış görüntüler özetle (digest) sabittir; yeni özet: python tools/dev_stack.py digests --pull (tek değişiklik).
# Tüm portlar yalnızca 127.0.0.1'e yayınlanır. Sırlar dosyadan okunur (compose secrets), ortam değişkenine
# veya imaja yazılmaz. Evren servisleri: root olmayan kullanıcı, salt okunur kök dosya sistemi, yetenek yok.
# Geliştirme kolaylıkları (yalnız burada): API dev oturumu (EVREN_DEV_CONTAINER, yalnız özel ağdan istek),
# Kafka ve OpenSearch şifresiz/düz metin. Üretimde: Entra, Kafka SASL/TLS, OpenSearch güvenlik eklentisi.
name: evren-dev

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

# Kafka istemci ayarları (geliştirme: düz metin, yalnızca bu ağda; üretimde SASL_SSL + konu ACL'leri, ADR-0017)
x-kafka: &kafka
  EVREN_KAFKA_BOOTSTRAP: kafka:9092
  EVREN_KAFKA_SECURITY_PROTOCOL: PLAINTEXT
  EVREN_KAFKA_ALLOW_PLAINTEXT: "1"

# OpenSearch istemci ayarları (geliştirme: güvenlik eklentisi kapalı, düz HTTP; üretimde HTTPS + kimlik, ADR-0018)
x-opensearch: &opensearch
  EVREN_OPENSEARCH_URL: http://opensearch:9200
  EVREN_OPENSEARCH_ALLOW_HTTP: "1"

x-evren: &evren
  <<: *hardening
  image: evren:dev
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]

services:
  postgres:
    <<: *hardening
    image: postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
    environment:
      POSTGRES_USER: evren_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_owner_password
      POSTGRES_DB: evren
      POSTGRES_INITDB_ARGS: "--data-checksums"
    secrets: [pg_owner_password]
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evren_owner -d evren"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Tek seferlik: göçler (izlenen), metadata tohumu, servis giriş rolleri (tools/migrate.py)
  migrate:
    <<: *evren
    restart: "no"
    command: ["migrate", "--service-roles", "/run/secrets"]
    environment:
      EVREN_DATABASE_URL_FILE: /run/secrets/owner_dsn
    secrets: [owner_dsn, evren_api_svc, evren_worker_svc, evren_gateway_svc, evren_ingest_svc, evren_indexer_svc,
              evren_connector_svc]
    depends_on:
      postgres: {condition: service_healthy}

  # İsteğe bağlı, tek seferlik: bağlayıcı çalıştırıcı (U5, ADR-0020). Veritabanı erişimi ve sırrı yoktur; yalnızca
  # alım geçidine gönderir. Belirteç dosyadan (EVREN_CONNECTOR_TOKEN_FILE) veya standart girdiden (/dev/stdin) okunur.
  #   docker compose run --rm -T -e EVREN_CONNECTOR_TOKEN_FILE=/dev/stdin connector connector-run --connector zabbix \
  #     --simulate connectors/zabbix/samples < belirtec-dosyasi
  connector:
    <<: *evren
    restart: "no"
    profiles: [tools]
    command: ["connector-run", "--help"]
    environment:
      EVREN_GATEWAY_URL: http://gateway:8089
      EVREN_GATEWAY_ALLOW_HTTP: "1"   # yalnızca geliştirme yığını; üretimde geçit TLS ile (EVREN_GATEWAY_CA_FILE)

  # Bağlayıcı çalıştırıcı servisi (U5.3b, ADR-0021): "şimdi çalıştır" istekleri ve zamanlama. CMDB yetkisi yoktur
  # (evren_app_connector); kaynak verisini alım geçidine gönderir. Kaynak sırları üretimde yalnızca bu serviste durur.
  # Geliştirmede kaynaklar simülatör; geçit belirteci duman testinin API'den verdiği kimlikten (profil: runner).
  connector-runner:
    <<: *evren
    profiles: [runner]
    command: ["connector-runner"]
    environment:
      EVREN_DATABASE_URL_FILE: /run/secrets/connector_dsn
      EVREN_CONNECTORS_FILE: /app/deploy/connectors.dev.yaml
      EVREN_GATEWAY_URL: http://gateway:8089
      EVREN_GATEWAY_ALLOW_HTTP: "1"        # yalnızca geliştirme yığını; üretimde TLS (EVREN_GATEWAY_CA_FILE)
      EVREN_CONNECTOR_ALLOW_SIMULATE: "1"  # yalnızca geliştirme: kaynak yerine örnek veri
      EVREN_RUNNER_NAME: dev-runner
      EVREN_WORKER_POLL_SECONDS: "5"
      EVREN_WORKER_HEALTH_FILE: /tmp/connector-runner.alive
    secrets: [connector_dsn]
    volumes: ["./secrets/connector:/run/connector:ro"]
    healthcheck:
      test: ["CMD", "python", "/app/deploy/evren.py", "healthcheck", "connector-runner"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migrate: {condition: service_completed_successfully}
      gateway: {condition: service_healthy}

  # İsteğe bağlı: sentetik demo verisi (boş veritabanına bir kez)
  demo:
    <<: *evren
    restart: "no"
    profiles: [demo]
    command: ["demo"]
    environment:
      EVREN_ALLOW_DEMO: "1"
      EVREN_DATABASE_URL_FILE: /run/secrets/owner_dsn
    secrets: [owner_dsn]
    depends_on:
      migrate: {condition: service_completed_successfully}

  api:
    <<: *evren
    command: ["api"]
    environment:
      <<: *opensearch
      EVREN_AUTH_MODE: dev
      EVREN_DEV_CONTAINER: "1"
      EVREN_HOST: 0.0.0.0
      EVREN_PORT: "8088"
      EVREN_DEV_USER: gelistirici
      EVREN_DEV_NAME: Geliştirici
      EVREN_DEV_ROLES: evren_reader,evren_match_reviewer,evren_cmdb_editor,evren_data_steward,evren_schema_designer,evren_security_reader
      EVREN_DATABASE_URL_FILE: /run/secrets/api_dsn
      EVREN_SESSION_KEY_FILE: /run/secrets/session_key
    secrets: [api_dsn, session_key]
    ports: ["127.0.0.1:8088:8088"]
    healthcheck:
      test: ["CMD", "python", "/app/deploy/evren.py", "healthcheck", "api"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migrate: {condition: service_completed_successfully}

  # İnsan istekleri, çalışma kapanışı ve outbox → Kafka (CI olayları)
  worker:
    <<: *evren
    command: ["worker"]
    environment:
      <<: *kafka
      EVREN_DATABASE_URL_FILE: /run/secrets/worker_dsn
      EVREN_WORKER_POLL_SECONDS: "15"
      EVREN_WORKER_HEALTH_FILE: /tmp/worker.alive
    secrets: [worker_dsn]
    healthcheck:
      test: ["CMD", "python", "/app/deploy/evren.py", "healthcheck", "worker"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}

  # Kafka alım tüketicisi: evren.ingest.record.v1 → kimlik çözümleme ve uzlaştırma (bölüm sayısı kadar ölçeklenir)
  ingest:
    <<: *evren
    command: ["ingest"]
    environment:
      <<: *kafka
      EVREN_DATABASE_URL_FILE: /run/secrets/ingest_dsn
      EVREN_WORKER_HEALTH_FILE: /tmp/ingest.alive
    secrets: [ingest_dsn]
    healthcheck:
      test: ["CMD", "python", "/app/deploy/evren.py", "healthcheck", "ingest"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}

  # Arama dizinleyicisi: CI olayları (Kafka) → güncel CI (PostgreSQL, salt okunur) → OpenSearch
  indexer:
    <<: *evren
    command: ["indexer"]
    environment:
      <<: [*kafka, *opensearch]
      EVREN_DATABASE_URL_FILE: /run/secrets/indexer_dsn
      EVREN_WORKER_HEALTH_FILE: /tmp/indexer.alive
    secrets: [indexer_dsn]
    healthcheck:
      test: ["CMD", "python", "/app/deploy/evren.py", "healthcheck", "indexer"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}
      opensearch: {condition: service_healthy}

  # Alım geçidi: bağlayıcıların tek giriş noktası (belirteç + kaynak yetkisi + şema + hız sınırı → Kafka).
  # Geliştirmede düz HTTP yalnızca 127.0.0.1'de; üretimde TLS (EVREN_GATEWAY_TLS_*), isteğe bağlı mTLS.
  gateway:
    <<: *evren
    command: ["gateway"]
    environment:
      <<: *kafka
      EVREN_GATEWAY_HOST: 0.0.0.0
      EVREN_GATEWAY_PORT: "8089"
      EVREN_GATEWAY_INSECURE_HTTP: "1"
      EVREN_DATABASE_URL_FILE: /run/secrets/gateway_dsn
    secrets: [gateway_dsn]
    ports: ["127.0.0.1:8089:8089"]
    healthcheck:
      test: ["CMD", "python", "/app/deploy/evren.py", "healthcheck", "gateway"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      migrate: {condition: service_completed_successfully}
      kafka: {condition: service_healthy}

  kafka:
    <<: *hardening
    image: apache/kafka:4.0.0@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["127.0.0.1:59092:9094"]
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 15s

  # Tek seferlik: Kafka konuları (otomatik konu açma kapalı). Ad ve bölüm sayısı deploy/kafka/topics.txt'te.
  kafka-init:
    <<: *hardening
    image: apache/kafka:4.0.0@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75
    restart: "no"
    entrypoint: ["/bin/bash", "/topics/create-topics.sh", "kafka:9092"]
    volumes:
      - ./kafka:/topics:ro
    depends_on:
      kafka: {condition: service_healthy}

  opensearch:
    <<: *hardening
    image: opensearchproject/opensearch:2.19.1@sha256:72fe2fc84be8295906b8efca020b46c58ed45c8da60cd9b8b49e1991e38e89a4
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"      # yalnızca yerel geliştirme; üretimde güvenlik eklentisi + TLS
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:59200:9200"]
    volumes:
      - os_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=5s >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

secrets:
  pg_owner_password: {file: ./secrets/pg_owner_password}
  owner_dsn: {file: ./secrets/owner_dsn}
  api_dsn: {file: ./secrets/api_dsn}
  worker_dsn: {file: ./secrets/worker_dsn}
  gateway_dsn: {file: ./secrets/gateway_dsn}
  ingest_dsn: {file: ./secrets/ingest_dsn}
  indexer_dsn: {file: ./secrets/indexer_dsn}
  connector_dsn: {file: ./secrets/connector_dsn}
  evren_api_svc: {file: ./secrets/evren_api_svc}
  evren_worker_svc: {file: ./secrets/evren_worker_svc}
  evren_gateway_svc: {file: ./secrets/evren_gateway_svc}
  evren_ingest_svc: {file: ./secrets/evren_ingest_svc}
  evren_indexer_svc: {file: ./secrets/evren_indexer_svc}
  evren_connector_svc: {file: ./secrets/evren_connector_svc}
  session_key: {file: ./secrets/session_key}

volumes:
  pg_data:
  kafka_data:
  os_data:
