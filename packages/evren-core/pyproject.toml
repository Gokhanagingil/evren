[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evren-core"
version = "0.1.0"
description = "Evren CMDB çekirdek alan mantığı: normalizasyon, kimlik çözümleme, uzlaştırma"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "postgres: gerçek PostgreSQL gerektirir (EVREN_TEST_PG ortam değişkeni)",
]

# Lint yapılandırması depo kökündeki ruff.toml dosyasındadır.
