# Tüm Python kodu için tek lint yapılandırması (CI: ruff check packages services tools apps/web/tests)
line-length = 140
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
# RUF001-003: Türkçe metinlerdeki karakterler; S101: testlerde assert
ignore = ["RUF001", "RUF002", "RUF003", "S101"]

[lint.flake8-bugbear]
# FastAPI bağımlılık ve parametre bildirimi deyimi
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[lint.isort]
known-first-party = ["evren_core", "evren_reconciler", "evren_api", "evren_gateway", "evren_indexer", "evren_connector_runner", "_bootstrap", "_font_metrics", "build_architecture", "build_demo",
                     "export_schemas", "dev_server", "sn_metadata_export", "load_demo_pg"]

[lint.per-file-ignores]
"**/tests/**" = ["S603", "S607", "S608"]
# Üretilmiş genişlik tablosu
"tools/_font_metrics.py" = ["E501"]
# Geliştirme yığını yardımcısı: yalnızca sabit "docker compose" komutları (kabuk yok) ve sabit 127.0.0.1 adresleri
"tools/dev_stack.py" = ["S310", "S603", "S607"]
# Bağlayıcı çalıştırıcı: alt süreç sabit argüman listesiyle (sys.executable + tools/connector_run.py), kabuk yok (ADR-0021)
"services/connector-runner/evren_connector_runner/runner.py" = ["S603"]
# Tohum SQL üreticisi: tüm değerler _q() ile kaçışlanır, tanımlayıcılar doğrulayıcıdaki
# düzenli ifadelerden geçer; çıktı yalnızca geliştirici/DBA tarafından uygulanır.
"packages/evren-core/src/evren_core/metadata.py" = ["S608"]
