# Evren kullanım kılavuzu (U8.2, ADR-0033). Tek kaynak bu klasördür; uygulamadaki Kılavuz sayfası
# tools/build_guide.py ile üretilen apps/web/content/guide.json'dan beslenir (CI --check ile denetler).
#
# Katmanlar: giriş sayfası kısa ve geneldir (kelime sınırı testlidir); ayrıntı konu sayfalarında; teknik belgeler
# yalnızca bağlantıyla (belge:...). Bağlantı biçimleri: kilavuz:<konu>, belge:<docs altındaki dosya, .md'siz>,
# #/<arayüz yolu>, https://...
#
# routes: o konunun anlattığı arayüz sayfaları; sayfadaki "?" yardımı bu konuya bağlanır.
title: Evren kullanım kılavuzu
