<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Evren CMDB: kaynak sistemlerden gelen gözlemleri anlamlandıran, kimliği çözen ve uzlaştıran konfigürasyon yönetim platformu">
  <title>Evren CMDB</title>
  <link rel="icon" href="/assets/evren.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/evren.css">
  <script type="module" src="/assets/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">İçeriğe geç</a>
  <aside id="sidebar" aria-label="Ana menü">
    <a class="brand" href="#/genel-bakis" title="Evren CMDB"><span class="mark" aria-hidden="true" id="brandMark"></span><span class="sr-only">Evren CMDB — ana sayfa</span></a>
    <nav id="nav" aria-label="Bölümler"></nav>
    <div class="nav-bottom">
      <button id="meButton" class="avatar" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="mePanel" title="Hesabım">E</button>
      <div id="mePanel" class="me-panel" hidden>
        <div class="identity"><strong>Yerel önizleme</strong><span>Kimlik doğrulama: Entra ID</span></div>
      </div>
    </div>
  </aside>
  <main id="main" tabindex="-1">
    <div id="topbar">
      <nav id="subnav" aria-label="Bu bölümün sayfaları" hidden></nav>
      <div id="crumbs" hidden></div>
      <span class="demo-flag" title="Ekranlardaki CI, kaynak çalışması ve kuyruk kayıtları sentetiktir">Sentetik demo verisi</span>
      <button id="searchOpen" type="button" aria-label="Ara (Ctrl+K)"><span>Ara…</span><kbd>Ctrl K</kbd></button>
      <button id="notifyOpen" type="button" aria-label="Bildirimler" title="Bildirimler" hidden></button>
      <button id="helpOpen" type="button" aria-label="Bu ekranın yardımı (?)" title="Bu ekranın yardımı (?)"></button>
    </div>
    <header id="topline">
      <div><h1 id="pageTitle">Yükleniyor…</h1><div id="pageSub"></div></div>
      <div id="topActions"></div>
    </header>
    <noscript><p class="notice">Evren arayüzü için JavaScript gereklidir.</p></noscript>
    <div id="view" aria-live="polite"></div>
  </main>
  <aside id="detail" aria-label="Kayıt ayrıntısı" aria-hidden="true" inert>
    <header class="detail-head">
      <div><div id="detailKicker"></div><h2 id="detailTitle" tabindex="-1">Kayıt</h2></div>
      <button class="btn secondary small" id="closeDetail" type="button" aria-label="Paneli kapat">Kapat ✕</button>
    </header>
    <div id="detailContent" class="detail-content"></div>
    <footer id="detailFooter" class="detail-footer"></footer>
  </aside>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
